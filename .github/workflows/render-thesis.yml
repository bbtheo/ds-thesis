name: Render thesis

on:
  push:
    branches: [main]

concurrency:
  group: render-thesis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create/update the rolling "latest" release
  pages: write # needed to deploy to GitHub Pages
  id-token: write # needed for the Pages OIDC deployment

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::ggplot2
            any::dplyr
            any::tidyr
            any::readr
            any::scales
            any::nanoparquet
            any::ggpattern
            any::patchwork
            any::gt
            any::lubridate
            any::glue

      - name: Render thesis.qmd (PDF via Typst + self-contained HTML)
        run: quarto render thesis.qmd

      - uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: |
            thesis.pdf
            thesis.html
          if-no-files-found: error

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp thesis.html _site/index.html
          cp thesis.pdf _site/thesis.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "Latest thesis render" \
              --notes "Auto-updated on every push to main."
          gh release upload latest thesis.pdf thesis.html \
            --repo "$GITHUB_REPOSITORY" --clobber

  deploy-pages:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
