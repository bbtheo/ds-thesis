name: Render thesis

on:
  push:
    branches: [main]

concurrency:
  group: render-thesis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create/update the rolling "latest" release

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::ggplot2
            any::dplyr
            any::readr
            any::scales

      - name: Render thesis.qmd (PDF via Typst + self-contained HTML)
        run: quarto render thesis.qmd

      - uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: |
            thesis.pdf
            thesis.html
          if-no-files-found: error

      - name: Publish to rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "Latest thesis render" \
              --notes "Auto-updated on every push to main."
          gh release upload latest thesis.pdf thesis.html \
            --repo "$GITHUB_REPOSITORY" --clobber
