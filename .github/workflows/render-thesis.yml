name: Render thesis

on:
  push:
    branches: [main]

concurrency:
  group: render-thesis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      # renv.lock is stale (see CLAUDE.md notes); CI installs only the
      # packages the thesis chunks actually use, so keep renv out of the way.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::ggplot2
            any::dplyr
            any::readr
            any::scales

      - name: Render thesis.qmd
        run: quarto render thesis.qmd

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis.pdf
          if-no-files-found: error
